name: Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Checkout builds
      uses: actions/checkout@v4
      with:
        ref: builds
        path: builds

    - name: Clean old builds
      run: rm $GITHUB_WORKSPACE/builds/*.cs3 || true

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Accept Android Licenses
      run: yes | sdkmanager --licenses || true

    - name: Build Plugins
      run: |
        chmod +x gradlew
        ./gradlew make

    - name: Generate plugins.json
      run: |
        cd builds
        # পুরো প্রোজেক্ট থেকে .cs3 ফাইল খুঁজে বের করা
        FILE_PATH=$(find .. -name "*.cs3" | head -n 1)
        if [ -z "$FILE_PATH" ]; then
          echo "No .cs3 file found!"
          exit 1
        fi
        FILE_NAME=$(basename "$FILE_PATH")
        cp "$FILE_PATH" .
        
        FILE_SIZE=$(stat -c%s "$FILE_NAME")
        FILE_HASH="sha256-$(sha256sum "$FILE_NAME" | awk '{print $1}')"
        
        echo '[
          {
            "url": "https://raw.githubusercontent.com/kalonjemes2220/TestPlugins/builds/'"$FILE_NAME"'",
            "status": 1,
            "version": 1,
            "name": "MovieBoxWeb",
            "internalName": "MovieBoxWebPlugin",
            "authors": ["kalonjemes2220"],
            "description": "MovieBox Web Provider",
            "repositoryUrl": "https://github.com/kalonjemes2220/TestPlugins",
            "language": "en",
            "tvTypes": ["Movie", "TvSeries"],
            "apiVersion": 1,
            "fileSize": '"$FILE_SIZE"',
            "fileHash": "'"$FILE_HASH"'"
          }
        ]' > plugins.json

    - name: Push builds
      run: |
        cd builds
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add *.cs3
        git add plugins.json
        git commit -m "Build new plugins and update plugins.json" || true
        git push
