- name: Push builds
      run: |
        cd builds
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # এখানে builds ফোল্ডারে থাকা .cs3 ফাইলগুলোকে মূল builds ব্রাঞ্চে কপি করা হচ্ছে
        cp *.cs3 . || true
        git add *.cs3
        git commit -m "Build new plugins" || true
        git push
